<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Modern tech-inspired logo with geometric shapes -->

  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer geometric frame -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#logoGradient)" opacity="0.1" stroke="url(#logoGradient)" stroke-width="1.5"/>

  <!-- Main geometric shape - stylized sphere with tech elements -->
  <g transform="translate(32, 32)">
    <!-- Central sphere -->
    <circle cx="0" cy="0" r="14" fill="url(#logoGradient)" opacity="0.9"/>

    <!-- Tech rings -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#logoGradient)" stroke-width="1" opacity="0.4"/>

    <!-- Accent dots for tech aesthetic -->
    <circle cx="0" cy="-20" r="2" fill="url(#accentGradient)"/>
    <circle cx="14" cy="10" r="2" fill="url(#accentGradient)"/>
    <circle cx="-14" cy="10" r="2" fill="url(#accentGradient)"/>

    <!-- Inner geometric pattern -->
    <path d="M -8 -8 L 8 -8 L 8 8 L -8 8 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <path d="M -4 -4 L 4 -4 L 4 4 L -4 4 Z" fill="white" opacity="0.6"/>
  </g>

  <!-- Sparkle accent (top right) -->
  <g transform="translate(48, 16)">
    <path d="M 0 -3 L 1 -1 L 3 0 L 1 1 L 0 3 L -1 1 L -3 0 L -1 -1 Z" fill="url(#accentGradient)" opacity="0.8"/>
  </g>
</svg>

